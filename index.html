<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Invitation - Slides</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #cdeaf8; 
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      font-family: 'Kalam', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
    }

    .wrapper {
      background-color: #dcf3ff; 
      aspect-ratio: 1080 / 1920;
      width: min(100vw, 100vh * (1080 / 1920));
      height: min(100vh, 100vw * (1920 / 1080));
      width: min(100vw, 100dvh * (1080 / 1920));
      height: min(100dvh, 100vw * (1920 / 1080));
      max-width: 1080px;
      max-height: 1920px;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
      transform: translateY(20px);
      overflow: hidden;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      z-index: 10;
    }

    /* --- SLIDE 1 --- */
    #slide-1 {
      justify-content: center;
      align-items: center;
      background-image: url('bege.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    #envelope-wrapper {
      position: relative;
      width: 88%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    #envelope-closed {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      z-index: 2;
      filter: drop-shadow(4px 6px 6px rgba(0, 0, 0, 0.15));
      transition: opacity 0.3s ease;
    }

    #envelope-open {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: block;
      z-index: 1;
      filter: drop-shadow(4px 6px 6px rgba(0, 0, 0, 0.15));
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #text-wrapper-open {
      position: absolute;
      top: 35%; 
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      text-align: center;
      opacity: 0;
      z-index: 3;
      pointer-events: none;
    }

    #envelope-wrapper.open #envelope-closed {
      opacity: 0;
      pointer-events: none;
    }

    #envelope-wrapper.open #envelope-open {
      opacity: 1;
      transform: translateY(-20px);
    }

    #envelope-wrapper.open #text-wrapper-open {
      opacity: 1;
      pointer-events: auto;
    }

    #animated-text {
      color: #1b6d97;
      font-size: clamp(1.4rem, 4.8vw, 2.1rem);
      line-height: 1.25;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.6);
      display: inline-block;
      opacity: 0;
      font-weight: 700;
    }

    /* Teks petunjuk universal di bawah ujung layar */
    .tap-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 0.95rem;
      color: #ffffff !important; 
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); 
      font-weight: 700;
      z-index: 20;
      pointer-events: none;
    }
    
    .tap-hint.show {
      opacity: 1;
      animation: fadeInHint 1s ease-in-out infinite alternate;
    }

    @keyframes fadeInHint {
      0% { transform: translateX(-50%) translateY(0); }
      100% { transform: translateX(-50%) translateY(-3px); }
    }

    @keyframes stopMotionDropText {
      0%, 19% { transform: translate(-30vw, -30vh) rotate(25deg) scale(1.2); opacity: 0; }
      20%, 39% { transform: translate(-15vw, -15vh) rotate(-15deg) scale(1.1); opacity: 1; }
      40%, 59% { transform: translate(-5vw, -5vh) rotate(10deg) scale(1.05); }
      60%, 79% { transform: translate(-1vw, -1vh) rotate(-5deg) scale(1.02); }
      80%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }

    @keyframes wiggleSlow {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    /* --- SLIDE 2 --- */
    #slide-2 {
      justify-content: space-between;
      align-items: center;
      padding: 35px 20px 30px 20px; 
    }

    /* --- SLIDE 3 --- */
    #slide-3 {
      justify-content: space-between;
      align-items: center;
      padding: 15px 12px 12px 12px;
      background-image: url('bege3.png');
      background-size: cover;
      background-position: center;
      transform: none !important;
    }

    /* --- SLIDE 4 --- */
    #slide-4 {
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 20px 15px;
      background-image: url('bege4.png');
      background-size: cover;
      background-position: center;
    }

    .s4-bg-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    .slide-4-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 70px 20px 120px 20px;
    }

    .s4-nama-img { width: 78%; max-width: 320px; height: auto; object-fit: contain; opacity: 0; flex-shrink: 0; }
    .s4-foto-img { width: 72%; max-width: 300px; height: auto; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.12)); opacity: 0; flex-shrink: 0; margin-top: -25px; }
    .s4-kata-img { width: 80%; max-width: 260px; height: auto; object-fit: contain; opacity: 0; flex-shrink: 0; margin-top: 25px; }

    #slide-4.active .s4-nama-img { animation: stopMotionDrop 1.2s forwards; animation-delay: 0.2s; }
    #slide-4.active .s4-foto-img { animation: s4FotoPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.5s; }
    #slide-4.active .s4-kata-img { animation: s4KataIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.8s; }

    @keyframes s4FotoPop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes s4KataIn {
      0% { transform: translateY(25px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes stopMotionDrop {
      0%, 19% { transform: translate(-40vw, -40vh) rotate(-20deg) scale(1.1); opacity: 0; }
      20%, 39% { transform: translate(-20vw, -20vh) rotate(10deg) scale(1.05); opacity: 1; }
      40%, 59% { transform: translate(-8vw, -8vh) rotate(-5deg) scale(1.02); }
      60%, 79% { transform: translate(-2vw, -2vh) rotate(3deg) scale(1.01); }
      80%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }

    .header-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .ornament-top { width: 92%; max-width: 380px; height: auto; object-fit: contain; opacity: 0; }
    .title-img { width: 84%; max-width: 300px; margin-top: 5px; opacity: 0; }
    .ornament-bottom { width: 92%; max-width: 380px; height: auto; object-fit: contain; opacity: 0; }

    @keyframes slideInRightTop { 0% { transform: translateX(100vw); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRightBottom { 0% { transform: translateX(100vw); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

    #slide-2.active .ornament-top { animation: slideInRightTop 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; animation-delay: 0.2s; }
    #slide-2.active .ornament-bottom { animation: slideInRightBottom 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; animation-delay: 0.4s; }

    .content-slide-2 { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 15px; margin: 10px 0; }
    .profile-row { display: flex; align-items: center; justify-content: center; width: 100%; gap: 20px; }
    .profile-frame { width: 40%; max-width: 135px; opacity: 0; display: flex; justify-content: center; }
    .profile-img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.1)); }
    .name-container { width: 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .name-img { width: 100% !important; max-width: 140px !important; height: auto !important; opacity: 0; }
    .center-ornament { width: 110px; height: auto; opacity: 0; margin: 2px 0; }
    .slide-2-message { text-align: center; color: #1b6d97; font-size: 1rem; font-weight: 700; opacity: 0; text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6); margin-top: 5px; }

    #slide-2.active .slide-2-message { animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 2.4s; }

    @keyframes popUp { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    #slide-2.active .title-img { animation: stopMotionDrop 1.2s forwards; animation-delay: 0.6s; }
    #slide-2.active .delay-foto-1 { animation: stopMotionDrop 1.2s forwards; animation-delay: 1.0s; }
    #slide-2.active .delay-foto-2 { animation: stopMotionDrop 1.2s forwards; animation-delay: 2.2s; }
    #slide-2.active .pop-up { animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    #slide-2.active .delay-nama-1 { animation-delay: 1.4s; }
    #slide-2.active .delay-cincin { animation-delay: 1.8s; }
    #slide-2.active .delay-nama-2 { animation-delay: 2.0s; }

    .s3-std-img { width: 95%; max-width: 430px; height: auto; object-fit: contain; opacity: 0; }
    #slide-3.active .s3-std-img { animation: stopMotionDrop 1.2s forwards; animation-delay: 0.2s; }

    .s3-cal-wrapper { position: relative; width: 76%; max-width: 320px; margin-top: 20px; opacity: 0; }
    .s3-cal-img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.08)); }
    .s3-circle-img { position: absolute; top: 55%; right: -4%; width: 18%; height: auto; object-fit: contain; transform: scale(0); animation: rotateAndPulse 2.5s infinite ease-in-out; }
    .s3-det-img { width: 90%; max-width: 380px; height: auto; object-fit: contain; margin-top: 15px; opacity: 0; }
    .s3-bottom-row { width: 100%; display: flex; justify-content: flex-end; align-items: flex-end; padding: 0 5px; opacity: 0; }
    .s3-meja-img { position: absolute; left: -110px; bottom: -60px; width: 82%; max-width: 360px; height: auto; object-fit: contain; z-index: 2; }
    .right-maps-container { display: flex; flex-direction: column; align-items: center; width: 46%; max-width: 190px; flex-shrink: 0; position: relative; z-index: 3; }
    .s3-click-img { width: 85%; height: auto; object-fit: contain; margin-bottom: -4px; animation: bounceArrow 2s infinite ease-in-out; }
    .maps-link { display: block; width: 100%; text-align: center; cursor: pointer; }
    .s3-maps-img { width: 100%; height: auto; object-fit: contain; transition: transform 0.2s ease; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.1)); }
    .s3-maps-img:active { transform: scale(0.95); }

    @keyframes slideInFromBottom { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes rotateAndPulse { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(6deg); } }
    @keyframes bounceArrow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    #slide-3.active .s3-cal-wrapper { animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.4s; }
    #slide-3.active .s3-circle-img { animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, rotateAndPulse 2.5s infinite ease-in-out; animation-delay: 0.5s, 1.4s; }
    #slide-3.active .s3-det-img { animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.6s; }
    #slide-3.active .s3-bottom-row { animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.8s; }

    /* --- SLIDE 5: RSVP & WISHES WALL --- */
    #slide-5 {
      justify-content: flex-start;
      align-items: center;
      padding: 30px 20px;
      overflow-y: auto;
      background-image: url('bege3.png');
      background-size: cover;
      background-position: center;
    }

    .s5-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #1b6d97;
      text-align: center;
      padding-bottom: 40px;
    }

    .s5-container h2 {
      font-size: 1.8rem;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .project-credit {
      font-size: 0.8rem;
      font-style: italic;
      color: #1b6d97;
      margin-top: -5px;
      opacity: 0.85;
    }

    .s5-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.75);
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border: 2px dashed #1b6d97;
      text-align: left;
    }

    .s5-form label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: -4px;
    }

    .s5-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #1b6d97;
      background: #ffffff;
      font-family: 'Kalam', cursive;
      font-size: 0.9rem;
      color: #1b6d97;
      outline: none;
    }

    .s5-submit-btn {
      background-color: #1b6d97;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 10px;
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background 0.2s;
      margin-top: 4px;
    }

    .s5-submit-btn:active {
      transform: scale(0.97);
    }

    .wishes-title {
      font-size: 1.2rem;
      margin-top: 8px;
      text-align: left;
    }

    .wishes-wall {
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      padding-right: 4px;
    }

    .wish-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 4px solid #1b6d97;
    }

    .wish-card strong {
      display: block;
      margin-bottom: 3px;
      color: #1b6d97;
      font-size: 0.95rem;
    }

    #music-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- SLIDE 1 -->
    <div id="slide-1" class="slide active">
      <div id="envelope-wrapper">
        <img src="TAP.png" alt="Tap Here Envelope" id="envelope-closed">
        <img src="NONGOL.png" alt="Open Envelope" id="envelope-open">
        
        <div id="text-wrapper-open">
          <span id="animated-text">You're<br>Invited</span>
        </div>
      </div>

      <!-- Teks petunjuk khusus Slide 1 (muncul setelah amplop terbuka) -->
      <div class="tap-hint slide1-hint">Ketuk layar untuk lanjut</div>
    </div>

    <!-- SLIDE 2 -->
    <div id="slide-2" class="slide">
      <div class="header-group">
        <img src="ornamen atas.png" alt="Ornamen Atas" class="ornament ornament-top">
        <img src="the eng.png" alt="The Engagement of" class="title-img">
      </div>
      
      <div class="content-slide-2">
         <div class="profile-row">
            <div class="profile-frame delay-foto-1">
               <img src="cowo.png" alt="Foto Revaldi" class="profile-img">
            </div>
            <div class="name-container">
               <img src="revaldi.png" alt="Revaldi Ali" class="name-img pop-up delay-nama-1">
            </div>
         </div>

         <img src="cincin.png" alt="Cincin" class="center-ornament pop-up delay-cincin">

         <div class="profile-row">
            <div class="name-container">
               <img src="Kirani Putri.png" alt="Kirani Putri" class="name-img pop-up delay-nama-2">
            </div>
            <div class="profile-frame delay-foto-2">
               <img src="cewe.png" alt="Foto Kirani" class="profile-img">
            </div>
         </div>
      </div>

      <div class="slide-2-message">#KiraniSayYesToRevaldi</div>
      <img src="ornamen bawah.png" alt="Ornamen Bawah" class="ornament ornament-bottom">

      <!-- Teks petunjuk di Slide 2 -->
      <div class="tap-hint show">Ketuk layar untuk lanjut</div>
    </div>

    <!-- SLIDE 3 -->
    <div id="slide-3" class="slide">
      <img src="std.png" alt="Save The Date" class="s3-std-img">
      
      <div class="s3-cal-wrapper">
        <img src="kalender.png" alt="Calendar October" class="s3-cal-img">
        <img src="angka.png" alt="Circle Marker" class="s3-circle-img">
      </div>

      <img src="alamat.png" alt="Time and Place Details" class="s3-det-img">

      <div class="s3-bottom-row">
        <img src="meja.png" alt="Meja Makan" class="s3-meja-img">
        <div class="right-maps-container">
          <img src="CLICK.png" alt="Click Here" class="s3-click-img">
          <a href="https://maps.app.goo.gl/5E6EoqckvSmWpCWX7?g_st=iw" target="_blank" class="maps-link">
            <img src="maps.png" alt="Open Maps" class="s3-maps-img">
          </a>
        </div>
      </div>

      <!-- Teks petunjuk di Slide 3 -->
      <div class="tap-hint show">Ketuk layar untuk lanjut</div>
    </div>

    <!-- SLIDE 4 -->
    <div id="slide-4" class="slide">
      <img src="border.png" alt="Border Frame" class="s4-bg-frame">
      <div class="slide-4-content">
        <img src="nama.png" alt="Revaldi & Kirani" class="s4-nama-img">
        <img src="fotokita.png" alt="Foto Pasangan" class="s4-foto-img">
        <img src="kata.png" alt="Kata-kata Undangan" class="s4-kata-img">
      </div>

      <!-- Teks petunjuk di Slide 4 -->
      <div class="tap-hint show">Ketuk layar untuk lanjut</div>
    </div>

    <!-- SLIDE 5: RSVP & WISHES (Halaman Terakhir Tanpa Tap Hint) -->
    <div id="slide-5" class="slide">
      <div class="s5-container">
        <h2>Confirmation And Your Best Wishes</h2>
        <div class="project-credit">project by @_saffiaaaa</div>
        
        <form id="rsvp-form" class="s5-form">
          <label>Nama :</label>
          <input type="text" id="rsvp-nama" placeholder="Masukkan nama..." required class="s5-input">
          
          <label>Konfirmasi Kehadiran:</label>
          <select id="rsvp-kehadiran" class="s5-input">
            <option value="Hadir">✨ Hadir dengan senang hati</option>
            <option value="Berhalangan">❌ Maaf, berhalangan hadir</option>
          </select>

          <label>Jumlah Tamu yang Hadir:</label>
          <input type="number" id="rsvp-jumlah" value="1" min="1" max="5" class="s5-input">

          <label>Your Best Wishes :</label>
          <textarea id="rsvp-ucapan" placeholder="Tuliskan doa terbaik..." rows="2" required class="s5-input"></textarea>
          
          <button type="submit" id="rsvp-btn" class="s5-submit-btn">Send</button>
        </form>

        <h3 class="wishes-title">💌 Your Best Wishes</h3>
        <div id="wishes-wall" class="wishes-wall">
          <div class="wish-card">Memuat ucapan...</div>
        </div>
      </div>
    </div>

    <!-- MUSIK -->
    <audio id="bg-music" loop>
      <source src="lagu.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" type="button">🎵</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCI_XYvjrS5ZojfN6BwoLwyV_LbuImtrEPwll_Hv1ZDTl6DajVdtkYwnFrhllLt80z/exec";

    document.addEventListener("DOMContentLoaded", () => {
      let currentSlide = 1;
      const totalSlides = 5;

      let touchStartY = 0;
      let touchStartX = 0;

      const envelopeWrapper = document.getElementById("envelope-wrapper");
      const animatedText = document.getElementById("animated-text");
      const slide1Hint = document.querySelector(".slide1-hint");
      let isEnvelopeOpened = false;

      function goToSlide(slideNum) {
        if (slideNum < 1 || slideNum > totalSlides) return;
        currentSlide = slideNum;

        for (let i = 1; i <= totalSlides; i++) {
          const slideEl = document.getElementById(`slide-${i}`);
          if (i === currentSlide) {
            slideEl.classList.add("active");
            if (currentSlide === 5) {
              loadWishes();
            }
          } else {
            slideEl.classList.remove("active");
          }
        }
      }

      const bgMusic = document.getElementById("bg-music");
      const musicToggle = document.getElementById("music-toggle");
      let musicStarted = false;

      function startMusic() {
        if (musicStarted) return;
        musicStarted = true;
        bgMusic.play().then(() => {
          musicToggle.textContent = "🎵";
        }).catch(() => {
          musicStarted = false;
        });
      }

      startMusic();

      musicToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (bgMusic.paused) {
          bgMusic.play();
          musicToggle.textContent = "🎵";
        } else {
          bgMusic.pause();
          musicToggle.textContent = "🔇";
        }
      });

      function openEnvelopeAction() {
        if (!isEnvelopeOpened) {
          isEnvelopeOpened = true;
          envelopeWrapper.classList.add("open");

          setTimeout(() => {
            animatedText.style.animation = "stopMotionDropText 1.2s forwards";
            
            setTimeout(() => {
              animatedText.style.opacity = "1";
              animatedText.style.animation = "wiggleSlow 3s ease-in-out infinite";
            }, 1200);

            setTimeout(() => {
              animatedText.style.transition = "opacity 0.4s ease";
              animatedText.style.opacity = "0";

              setTimeout(() => {
                animatedText.innerHTML = "To Our<br>Engagement";
                animatedText.style.transition = "none";
                animatedText.style.animation = "stopMotionDropText 1.2s forwards";
                
                setTimeout(() => {
                  animatedText.style.opacity = "1";
                  animatedText.style.animation = "wiggleSlow 3s ease-in-out infinite";
                  
                  // MUNCUL PAS "To Our Engaged" di Slide 1
                  if (slide1Hint) slide1Hint.classList.add("show");
                }, 1200);
              }, 400);
            }, 2500);

          }, 400);
          return true;
        }
        return false;
      }

      document.body.addEventListener('click', (e) => {
        if (e.target.closest('.maps-link') || e.target.closest('#music-toggle') || e.target.closest('#slide-5')) return;
        startMusic();

        if (currentSlide === 1) {
          if (!openEnvelopeAction()) {
            goToSlide(2);
          }
          return;
        }

        if (currentSlide < totalSlides) {
          goToSlide(currentSlide + 1);
        }
      });

      document.addEventListener('touchstart', e => { 
        touchStartY = e.touches[0].clientY; 
        touchStartX = e.touches[0].clientX;
        startMusic();
      }, {passive: true});

      document.addEventListener('touchend', e => {
        if (currentSlide === 5) return;

        let diffY = touchStartY - e.changedTouches[0].clientY;
        let diffX = touchStartX - e.changedTouches[0].clientX;

        if (Math.abs(diffY) > Math.abs(diffX)) {
          if (diffY > 40) {
            if (currentSlide === 1) {
              if (!openEnvelopeAction()) {
                goToSlide(2);
              }
              return;
            }
            if (currentSlide < totalSlides) goToSlide(currentSlide + 1);
          } else if (diffY < -40) {
            if (currentSlide > 1) goToSlide(currentSlide - 1);
          }
        }
      }, {passive: true});

      // --- HANDLE FORM RSVP & WISHES ---
      const rsvpForm = document.getElementById("rsvp-form");
      const rsvpBtn = document.getElementById("rsvp-btn");
      const wishesWall = document.getElementById("wishes-wall");

      rsvpForm.addEventListener("submit", (e) => {
        e.preventDefault();
        
        const nama = document.getElementById("rsvp-nama").value;
        const kehadiran = document.getElementById("rsvp-kehadiran").value;
        const jumlah = document.getElementById("rsvp-jumlah").value;
        const ucapan = document.getElementById("rsvp-ucapan").value;

        rsvpBtn.textContent = "Mengirim...";
        rsvpBtn.disabled = true;

        const data = { nama, kehadiran, jumlah, ucapan };

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        }).then(() => {
          alert("Terima kasih! RSVP dan doa Anda berhasil dikirim.");
          rsvpForm.reset();
          rsvpBtn.textContent = "Send";
          rsvpBtn.disabled = false;
          loadWishes();
        }).catch((error) => {
          console.error("Error:", error);
          alert("Gagal mengirim pesan. Silakan coba lagi.");
          rsvpBtn.textContent = "Send";
          rsvpBtn.disabled = false;
        });
      });

      function loadWishes() {
        if (SCRIPT_URL.includes("MASUKKAN_URL")) {
          wishesWall.innerHTML = `<div class="wish-card">URL Google Script belum diatur di file kodenya.</div>`;
          return;
        }

        fetch(SCRIPT_URL)
          .then(response => response.json())
          .then(data => {
            wishesWall.innerHTML = "";
            if (data.length === 0) {
              wishesWall.innerHTML = `<div class="wish-card">Belum ada ucapan. Jadilah yang pertama!</div>`;
              return;
            }
            data.forEach(item => {
              const card = document.createElement("div");
              card.className = "wish-card";
              card.innerHTML = `
                <strong>${escapeHtml(item.nama)}</strong>
                <p>"${escapeHtml(item.ucapan)}"</p>
              `;
              wishesWall.appendChild(card);
            });
          })
          .catch(err => {
            console.error("Gagal memuat ucapan:", err);
            wishesWall.innerHTML = `<div class="wish-card">Gagal memuat daftar ucapan.</div>`;
          });
      }

      function escapeHtml(text) {
        if (!text) return "";
        return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    });
  </script>

</body>
</html>
