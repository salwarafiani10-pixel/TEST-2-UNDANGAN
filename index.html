<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    background-color: #cdeaf8; 
    width: 100%;
    min-height: 100%;
    height: 100vh;
    height: 100dvh; /* Mengatasi masalah tinggi layar di HP */
    overflow: hidden; 
    font-family: 'Kalam', cursive;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .wrapper {
    background-color: #dcf3ff; 
    width: 100%;
    max-width: 420px; 
    height: 100%;
    max-height: 100vh;
    max-height: 100dvh;
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    transform: translateY(30px);
    overflow: hidden; /* Mencegah elemen keluar batas slide */
  }

  .slide.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    z-index: 10;
  }

  #slide-1 {
    justify-content: center;
    align-items: center;
    background-image: url('bege.png');
    background-size: cover;
    background-position: center;
  }

  #slide-2 {
    justify-content: space-between; 
    padding: 8px 0; 
  }

  /* SLIDE 3 */
  #slide-3 {
    justify-content: flex-start;
    align-items: center;
    padding: 8px 10px 0 10px;
    background-image: url('bege3.png');
    background-size: cover;
    background-position: center;
    transition: opacity 0.8s ease-in-out;
    transform: none !important;
  }

  /* --- SLIDE 4 --- */
  #slide-4 {
    justify-content: flex-start;
    align-items: center;
    padding: 0;
    background-image: url('bege4.png');
    background-size: cover;
    background-position: center;
  }

  .s4-bg-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }

  .slide-4-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 15px;
  }

  .s4-nama-img {
    width: 55%;
    max-width: 190px;
    height: auto;
    object-fit: contain;
    opacity: 0;
    margin-top: 45px;
    flex-shrink: 0;
  }

  .s4-foto-img {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    width: 50%;
    max-width: 190px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.12));
    opacity: 0;
    margin: 0;
  }

  .s4-kata-img {
    position: absolute;
    left: 50%;
    bottom: 50px;
    transform: translateX(-50%);
    width: 75%;
    max-width: 260px;
    height: auto;
    object-fit: contain;
    opacity: 0;
    margin: 0;
  }

  /* Animasi Slide 4 */
  #slide-4.active .s4-nama-img {
    animation: stopMotionDrop 1.2s forwards;
    animation-delay: 0.2s;
  }

  #slide-4.active .s4-foto-img {
    animation: s4FotoPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.5s;
  }

  #slide-4.active .s4-kata-img {
    animation: s4KataIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.8s;
  }

  @keyframes s4FotoPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    80% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  @keyframes s4KataIn {
    0% { transform: translate(-50%, 35px); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 1; }
  }

  #scrapbook-container {
    position: relative;
    width: 80%;
    max-width: 300px;
    animation: stopMotionDrop 1.8s forwards;
  }

  .frame-image {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(4px 6px 4px rgba(0, 0, 0, 0.15));
  }

  #text-wrapper {
    position: absolute;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, -50%);
    width: 65%; 
    text-align: center;
  }

  #animated-text {
    color: #1b6d97;
    font-size: clamp(1.4rem, 4.5vw, 2rem);
    line-height: 1.3;
    text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.6);
    display: inline-block;
    opacity: 0;
    font-weight: 700;
  }

  #tap-hint {
    position: absolute;
    bottom: 3vh;
    color: #1b6d97; 
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 1s ease;
    font-weight: 700;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
  }

  @keyframes stopMotionDrop {
    0%, 19% { transform: translate(-40vw, -40vh) rotate(-20deg) scale(1.1); opacity: 0; }
    20%, 39% { transform: translate(-20vw, -20vh) rotate(10deg) scale(1.05); opacity: 1; }
    40%, 59% { transform: translate(-8vw, -8vh) rotate(-5deg) scale(1.02); }
    60%, 79% { transform: translate(-2vw, -2vh) rotate(3deg) scale(1.01); }
    80%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  }

  .floating {
    animation: floatSubtle 4s ease-in-out infinite;
  }

  @keyframes floatSubtle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes stopMotionDropText {
    0%, 19% { transform: translate(-30vw, -30vh) rotate(25deg) scale(1.2); opacity: 0; }
    20%, 39% { transform: translate(-15vw, -15vh) rotate(-15deg) scale(1.1); opacity: 1; }
    40%, 59% { transform: translate(-5vw, -5vh) rotate(10deg) scale(1.05); }
    60%, 79% { transform: translate(-1vw, -1vh) rotate(-5deg) scale(1.02); }
    80%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  }

  @keyframes wiggleSlow {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  @keyframes pulseHint {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .header-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-top: 5px; 
  }

  .ornament-top {
    width: 75%; 
    max-width: 300px;
    height: auto; 
    object-fit: contain;
    opacity: 0; 
  }

  .title-img {
    width: 80%; 
    max-width: 280px;
    margin-top: -10px; 
    opacity: 0; 
  }

  .ornament-bottom {
    width: 75%; 
    max-width: 300px;
    height: auto; 
    object-fit: contain;
    opacity: 0; 
  }

  @keyframes slideInRightTop {
    0% { transform: translateX(100vw); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideInRightBottom {
    0% { transform: translateX(100vw); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  #slide-2.active .ornament-top {
    animation: slideInRightTop 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    animation-delay: 0.2s;
  }

  #slide-2.active .ornament-bottom {
    animation: slideInRightBottom 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    animation-delay: 0.4s; 
  }

  .content-slide-2 {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;
    width: 100%;
    padding: 0 15px;
    gap: 8px; 
  }

  .profile-row {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 12px;
  }

  .profile-frame {
    width: 38%; 
    max-width: 120px; 
    opacity: 0; 
    display: flex;
    justify-content: center;
  }

  .profile-img {
    width: 100%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.1));
  }

  .name-container {
    width: 42%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .name-img {
    width: 100% !important; 
    max-width: 130px !important;
    height: auto !important;
    opacity: 0;
  }

  .center-ornament {
    width: 140px; 
    height: auto;
    opacity: 0;
    margin: -2px 0;
  }

  .slide-2-message {
    text-align: center;
    color: #1b6d97;
    font-size: 1rem;
    font-weight: 700;
    opacity: 0;
    margin-bottom: 5px;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
  }

  #slide-2.active .slide-2-message {
    animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 2.4s;
  }

  @keyframes popUp {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  #slide-2.active .title-img {
    animation: stopMotionDrop 1.2s forwards;
    animation-delay: 0.6s;
  }

  #slide-2.active .delay-foto-1 {
    animation: stopMotionDrop 1.2s forwards;
    animation-delay: 1.0s;
  }
  #slide-2.active .delay-foto-2 {
    animation: stopMotionDrop 1.2s forwards;
    animation-delay: 2.2s;
  }

  #slide-2.active .pop-up {
    animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  #slide-2.active .delay-nama-1 { animation-delay: 1.4s; }
  #slide-2.active .delay-cincin { animation-delay: 1.8s; }
  #slide-2.active .delay-nama-2 { animation-delay: 2.0s; }

  /* SLIDE 3 */
  .s3-std-img {
    width: 70%;
    max-width: 260px;
    height: auto;
    object-fit: contain;
    opacity: 0;
  }
  #slide-3.active .s3-std-img {
    animation: stopMotionDrop 1.2s forwards;
    animation-delay: 0.2s;
  }

  .s3-cal-wrapper {
    position: relative;
    width: 60%;
    max-width: 220px;
    opacity: 0;
    margin-top: 10px;
  }

  .s3-cal-img {
    width: 100%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.08));
  }

  .s3-circle-img {
    position: absolute;
    top: 55%;
    right: -4%;
    width: 18%;
    height: auto;
    object-fit: contain;
    transform: scale(0);
    animation: rotateAndPulse 2.5s infinite ease-in-out;
  }

  .s3-det-img {
    width: 75%;
    max-width: 280px;
    height: auto;
    object-fit: contain;
    opacity: 0;
    margin-top: 8px;
  }

  .s3-bottom-row {
    position: absolute;
    bottom: 5px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 10px;
    opacity: 0;
  }

  .s3-meja-img {
    width: 45%;
    max-width: 160px;
    height: auto;
    object-fit: contain;
  }

  .right-maps-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 40%;
    max-width: 140px;
    margin-bottom: 10px;
  }

  .s3-click-img {
    width: 90%;
    height: auto;
    object-fit: contain;
    margin-bottom: -5px;
    animation: bounceArrow 2s infinite ease-in-out;
  }

  .maps-link {
    display: block;
    width: 100%;
    text-align: center;
    cursor: pointer;
  }

  .s3-maps-img {
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: transform 0.2s ease;
    filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.1));
  }

  .s3-maps-img:active {
    transform: scale(0.95);
  }

  @keyframes slideInFromBottom {
    0% { transform: translateY(30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  @keyframes rotateAndPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.1) rotate(6deg); }
  }

  @keyframes bounceArrow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  #slide-3.active .s3-cal-wrapper {
    animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.4s;
  }

  #slide-3.active .s3-circle-img {
    animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, rotateAndPulse 2.5s infinite ease-in-out;
    animation-delay: 0.5s, 1.4s;
  }

  #slide-3.active .s3-det-img {
    animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.6s;
  }

  #slide-3.active .s3-bottom-row {
    animation: slideInFromBottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.8s;
  }
</style>
